<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | InternPath</title>
    <meta
      name="description"
      content="Online Internship Placement and Monitoring System — sign in to continue."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-page">
      <aside class="brand-panel" aria-hidden="false">
        <div class="brand-glow"></div>
        <div class="brand-orb brand-orb--one"></div>
        <div class="brand-orb brand-orb--two"></div>

        <div class="brand-content">
          <p class="brand-mark">InternPath</p>
          <h1>Place. Monitor. Succeed.</h1>
          <p class="brand-lead">
            A calm workspace for internship placement, progress tracking, and supervisor feedback.
          </p>
        </div>
      </aside>

      <main class="form-panel">
        <div class="form-wrap">
          <header class="form-header">
            <p class="form-kicker">Welcome back</p>
            <h2>Sign in to InternPath</h2>
            <p class="form-sub">Admin access for internship placement and monitoring.</p>
          </header>

          <form id="loginForm" class="login-form" novalidate>
            <input type="hidden" id="roleInput" name="role" value="admin" />

            <label class="field">
              <span>Username</span>
              <input
                type="text"
                id="usernameInput"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
              />
            </label>

            <label class="field">
              <span>Password</span>
              <div class="password-row">
                <input
                  type="password"
                  id="passwordInput"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                  minlength="6"
                />
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                  Show
                </button>
              </div>
            </label>

            <div class="form-meta">
              <label class="remember">
                <input type="checkbox" id="rememberMe" name="remember" />
                <span>Remember me</span>
              </label>
              <a href="#" class="link-muted">Forgot password?</a>
            </div>

            <p class="form-error" id="formError" hidden></p>

            <button type="submit" class="btn-submit" id="submitBtn">
              <span>Sign in</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M5 12h14M13 6l6 6-6 6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </form>

          <p class="form-footer">
            New to InternPath?
            <a href="#">Request access</a>
          </p>
        </div>
      </main>
    </div>

    <script src="login.js"></script>
  </body>
</html>
